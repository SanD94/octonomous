[package]
name = "octonomous-core"
description = "UI-independent OpenCode protocol core for octonomous"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.9"
fastrand = "2.3"
futures-core = "0.3"
futures-util = "0.3"
progenitor-client = "0.15.0"
regress = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
reqwest-eventsource = { package = "kameleoon-reqwest-eventsource", version = "0.6.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
wiremock = "0.6.5"
