[package]
name = "octonomous-core"
description = "UI-independent OpenCode protocol core for octonomous"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
bytes = "1.9"
futures-core = "0.3"
progenitor-client = "0.15.0"
regress = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

[dev-dependencies]
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
