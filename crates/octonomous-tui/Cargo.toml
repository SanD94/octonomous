[package]
name = "octonomous-tui"
description = "Native terminal client for octonomous"
edition.workspace = true
version.workspace = true

[[bin]]
name = "octonomous"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
octonomous-core = { path = "../octonomous-core" }
ratatui = "0.29"
tokio = { version = "1.0", features = ["macros", "rt", "signal", "time"] }
